[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jude"
version = "0.1.0"
description = "Local-first anonymization for legal documents before LLM use"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Etienne Perrin" }]
keywords = ["legal", "privacy", "anonymization", "llm", "ner"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Legal Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
]
dependencies = [
    "spacy>=3.7,<4",
    "python-docx>=1.1",
    "pydantic>=2.6",
    "anthropic>=0.40",
    "streamlit>=1.32",
    "typer>=0.12",
    "rich>=13.7",
    "langdetect>=1.0.9",
]

[project.optional-dependencies]
gliner = ["gliner>=0.2"]
privacy-filter = ["transformers>=4.40", "torch>=2.0"]
pdf = ["pymupdf>=1.24"]
ocr = ["ocrmypdf>=16.0", "img2pdf>=0.5", "Pillow>=10.0"]
xlsx = ["openpyxl>=3.1"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
jude = "jude.cli:app"

[project.urls]
Homepage = "https://github.com/etienne/jude"
Issues = "https://github.com/etienne/jude/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
"jude.data" = ["*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
